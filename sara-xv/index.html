  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #09090c;
      background-image:
        radial-gradient(ellipse at 50% 15%, rgba(45, 45, 55, 0.45) 0%, transparent 70%),
        linear-gradient(180deg, #09090c 0%, #030305 100%);
      font-family: 'Playfair Display', Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* Contenedor tipo Tarjeta de Gala en Móvil y Escritorio */
    .card-container {
      width: 100%;
      max-width: 500px;
      min-height: 100dvh;
      background: #fbfaf7;
      background-image: radial-gradient(ellipse at 50% 35%, #ffffff 0%, #fbfaf7 68%, #f2efe8 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px 44px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75);
      overflow: hidden;
    }

    @media (min-width: 501px) {
      .card-container {
        min-height: auto;
        margin: 40px 0;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    }

    /* 4 Esquinas Victorianas perfectamente calibradas */
    .corner {
      position: absolute;
      width: 68px;
      height: 68px;
      pointer-events: none;
      z-index: 5;
    }
    .c-tl { top: 16px; left: 16px; }
    .c-tr { top: 16px; right: 16px; transform: scaleX(-1); }
    .c-bl { bottom: 16px; left: 16px; transform: scaleY(-1); }
    .c-br { bottom: 16px; right: 16px; transform: scale(-1, -1); }

    .phrase-img {
      width: 260px;
      max-width: 72%;
      height: auto;
      display: block;
      margin-top: 15px;
      margin-bottom: 14px;
    }

    .bow-img {
      width: 440px;
      max-width: 92%;
      height: auto;
      display: block;
      margin-bottom: 16px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.06));
    }

    .mis-xv-img {
      width: 210px;
      max-width: 52%;
      height: auto;
      display: block;
      margin-bottom: 6px;
    }

    .name-img {
      width: 340px;
      max-width: 82%;
      height: auto;
      display: block;
      margin-bottom: 16px;
    }

    .date-img {
      width: 320px;
      max-width: 78%;
      height: auto;
      display: block;
      margin-bottom: 12px;
    }

    .time-text {
      font-size: 20px;
      font-style: italic;
      font-weight: 600;
      color: #222222;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
      text-align: center;
    }

    .arrow-img {
      width: 200px;
      max-width: 50%;
      height: auto;
      display: block;
      margin-bottom: 22px;
    }

    /* Grupo de Botones Interactivos */
    .btn-group {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
    }

    .btn-gothic {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 24px;
      background: #141418;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 999px;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      box-shadow: 0 8px 22px rgba(0,0,0,0.32);
      border: 1px solid rgba(255,255,255,0.18);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn-gothic:hover, .btn-gothic:active {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.45);
      background: #000000;
      border-color: rgba(255,255,255,0.35);
    }

    .btn-gothic.btn-wa {
      background: #1e293b;
      border-color: #475569;
    }
    .btn-gothic.btn-wa:hover, .btn-gothic.btn-wa:active {
      background: #0f172a;
      border-color: #64748b;
    }

    .footer-text {
      margin-top: 18px;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #64748b;
      text-align: center;
    }
  </style>
